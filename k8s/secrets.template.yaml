# Optional. Copy to secrets.yaml and uncomment only the settings you need.
# Keep the committed template empty; encrypt populated secrets before committing.
apiVersion: v1
kind: Secret
metadata:
  name: c2-secrets
  namespace: devsec
type: Opaque
stringData: {}
# To configure values, replace stringData: {} with, for example:
# stringData:
#   setLicenseKey: "REPLACE_WITH_LICENSE_KEY"
#   recoverAccount: "REPLACE_WITH_USERNAME"
#   setPass: "REPLACE_WITH_TEMPORARY_PASSWORD"
#   setEdition: "community"
#   resetTOTP: "REPLACE_WITH_USERNAME"
#   allowIP: "REPLACE_WITH_IP_ADDRESS"
#   resetFirewall: "true"
# All values must be strings, including boolean settings.
# Recovery settings should be removed after use and the Pod restarted.
