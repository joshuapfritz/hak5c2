apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudc2
  namespace: devsec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudc2
  template:
    metadata:
      labels:
        app: cloudc2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: c2
          # Publish the tested build to this tag before applying.
          image: joshuapfritz/hak5c2:3.5.2
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # C2/Overseer moves its executable during startup.
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 2022
          envFrom:
            - configMapRef:
                name: c2-config
            - secretRef:
                name: c2-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: c2-data
